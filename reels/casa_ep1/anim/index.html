<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>A Casa da Falésia · EP 1 — Motor 3D</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#080d15;color:white;font:14px Arial;overflow:hidden}
    #stage{width:100vw;height:100vh;display:grid;place-items:center}
    #stage>div{position:relative;width:min(100vw,177.777vh);aspect-ratio:16/9}
    canvas{position:absolute;width:100%;height:100%;object-fit:contain}
    #overlay{pointer-events:none}
    #hud{position:fixed;bottom:12px;left:12px;right:12px;display:flex;gap:12px;align-items:center;background:#091521db;border:1px solid #7193a5;padding:10px;border-radius:10px}
    body.frame #hud,body.qa #hud{display:none !important}
    button{background:#d9b772;border:0;border-radius:5px;padding:8px 16px;font-weight:bold;cursor:pointer}
    input{flex:1}
  </style>
</head>
<body>
  <div id="stage">
    <div>
      <canvas id="c" width="1920" height="1080"></canvas>
      <canvas id="overlay" width="1920" height="1080"></canvas>
    </div>
  </div>
  <div id="hud">
    <button id="play">▶ PLAY</button>
    <input id="scrub" type="range" min="0" max="60" step="0.0166667" value="0">
    <span id="time">0.00 / 60.00</span>
  </div>
  <script type="module" src="./main.js"></script>
</body>
</html>
