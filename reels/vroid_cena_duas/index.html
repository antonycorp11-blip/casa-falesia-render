<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Luna e Bia · A casa da falésia</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #080e18; }
    body { display: grid; place-items: center; font-family: system-ui, sans-serif; color: white; }
    #stage { position: relative; width: min(100vw, 177.77778vh); aspect-ratio: 16 / 9; overflow: hidden; background: #0b1421; }
    #c { width: 100%; height: 100%; display: block; }
    #play { position: absolute; inset: 0; display: grid; place-items: center; width: 100%; border: 0; background: rgba(3, 8, 18, .58); color: #fff; cursor: pointer; font: 800 clamp(5rem, 13vw, 12rem)/1 system-ui, sans-serif; text-shadow: 0 0 35px #6bb9e8; }
    #play[hidden] { display: none; }
    #play span { display: grid; place-items: center; width: clamp(9rem, 22vw, 18rem); aspect-ratio: 1; border-radius: 50%; background: rgba(26, 49, 76, .83); border: 3px solid rgba(214, 237, 255, .85); padding-left: .1em; box-shadow: 0 0 85px rgba(101, 168, 233, .4); }
    #legenda { position: absolute; left: 11%; right: 11%; bottom: 5%; min-height: 9%; padding: .5em 1em; text-align: center; font-size: clamp(16px, 2.25vw, 39px); line-height: 1.3; font-weight: 650; text-shadow: 0 2px 6px #000, 0 0 12px #000; pointer-events: none; }
    #legenda:empty { display: none; }
    #legenda strong { color: #f9cf8c; margin-right: .38em; }
    #erro { position: absolute; top: 2%; left: 3%; right: 3%; z-index: 5; color: #fff; background: rgba(87, 18, 24, .88); font-size: clamp(14px, 1.3vw, 23px); padding: .5em .8em; display: none; }
    #erro:not(:empty) { display: block; }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="c" width="1920" height="1080"></canvas>
    <div id="legenda" aria-live="off"></div>
    <button id="play" type="button" aria-label="Iniciar áudio e cena"><span>▶</span></button>
    <div id="erro" role="alert"></div>
  </div>
  <audio id="audio" preload="auto" src="./audio.mp3"></audio>
  <script type="module" src="./cena_duas.js"></script>
</body>
</html>
