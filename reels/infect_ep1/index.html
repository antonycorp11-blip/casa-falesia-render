<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>INFECT · Motor</title>
  <style>
    * { box-sizing: border-box; }
    html,body { width:100%;height:100%;margin:0;background:#020408;color:white;font-family:system-ui,sans-serif; }
    body { display:grid;place-items:center;overflow:hidden; }
    #stage { position:relative;width:min(100vw,177.7778vh);aspect-ratio:16/9;overflow:hidden;background:#020408;box-shadow:0 12px 48px #000b; }
    .vertical #stage { width:min(100vw,56.25vh);aspect-ratio:9/16; }
    canvas { position:absolute;inset:0;width:100%;height:100%;display:block; }
    #overlay { pointer-events:none;z-index:2; }
    #play { position:absolute;inset:0;z-index:3;width:100%;border:0;background:#03081299;color:white;display:grid;place-items:center;cursor:pointer;font:900 clamp(3rem,8vw,7rem)/1 system-ui,sans-serif; }
    #play[hidden] { display:none; }
    #play span { display:grid;place-items:center;width:clamp(6rem,16vw,10rem);aspect-ratio:1;border-radius:50%;background:#243d58d9;border:3px solid #d6edff;padding-left:.1em;box-shadow:0 0 60px #65a8e977; }
    #erro { position:absolute;top:2%;left:2%;right:2%;z-index:4;padding:.5em .8em;background:#571218ed;font-size:clamp(12px,2vw,20px); }
    #erro:empty { display:none; }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="c" width="1920" height="1080"></canvas>
    <canvas id="overlay" width="1920" height="1080"></canvas>
    <button id="play" type="button" aria-label="Iniciar áudio e cena"><span>▶</span></button>
    <div id="erro" role="alert"></div>
  </div>
  <audio id="audio" preload="auto"></audio>
  <script type="module" src="./motor.js"></script>
</body>
</html>
