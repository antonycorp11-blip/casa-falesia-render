<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Luna e Bia · Short 1 — Não Abra a Porta</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #050910; }
    body { display: grid; place-items: center; font-family: system-ui, -apple-system, sans-serif; color: #fff; }
    #stage {
      position: relative;
      width: min(100vw, 56.25vh);
      aspect-ratio: 9 / 16;
      overflow: hidden;
      background: #070d16;
      box-shadow: 0 12px 48px rgba(0, 0, 0, 0.72);
    }
    #c, #overlay {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    #c { z-index: 1; }
    #overlay { z-index: 3; pointer-events: none; }
    #hud { display: none; }
    #legenda {
      position: absolute;
      left: 6%;
      right: 6%;
      bottom: 6%;
      z-index: 2;
      opacity: 0;
      pointer-events: none;
    }
    #play {
      position: absolute;
      inset: 0;
      z-index: 4;
      display: grid;
      place-items: center;
      width: 100%;
      border: 0;
      background: rgba(3, 8, 18, .58);
      color: #fff;
      cursor: pointer;
      font: 800 clamp(3rem, 11vw, 7rem)/1 system-ui, sans-serif;
      text-shadow: 0 0 35px #6bb9e8;
    }
    #play[hidden] { display: none; }
    #play span {
      display: grid;
      place-items: center;
      width: clamp(6rem, 22vw, 11rem);
      aspect-ratio: 1;
      border-radius: 50%;
      background: rgba(26, 49, 76, .83);
      border: 3px solid rgba(214, 237, 255, .85);
      padding-left: .1em;
      box-shadow: 0 0 65px rgba(101, 168, 233, .45);
    }
    #erro {
      position: absolute;
      top: 2%;
      left: 3%;
      right: 3%;
      z-index: 6;
      color: #fff;
      background: rgba(87, 18, 24, .92);
      font-size: clamp(12px, 2vw, 20px);
      padding: .5em .8em;
      display: none;
    }
    #erro:not(:empty) { display: block; }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="c" width="1080" height="1920"></canvas>
    <canvas id="overlay" width="1080" height="1920"></canvas>
    <div id="hud" aria-hidden="true"></div>
    <div id="legenda" aria-live="off"></div>
    <button id="play" type="button" aria-label="Iniciar áudio e cena"><span>▶</span></button>
    <div id="erro" role="alert"></div>
  </div>
  <audio id="audio" preload="auto" src="./audio.mp3"></audio>
  <script type="module" src="./short1.js"></script>
</body>
</html>
